<!doctype html>
<html lang="es-PR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f2d9">
  <meta name="robots" content="noindex, nofollow">
  <title>Tus datos | Rayo de Luz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Unbounded:wght@500;600;700;800;900&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="sin-barra" data-pagina="comprar">
  <main>
    <section class="seccion">
      <div class="contenedor">
        <h1>Casi listo</h1>
        <div class="bloque resumen">
          <img src="img/obra.jpeg" alt="" width="76" height="114">
          <div>
            <b>Un Rayo Nuestro</b><br>
            <span data-cant></span> · <span data-unitario></span><br>
            <a href="sorteo.html">Cambiar cantidad</a>
          </div>
        </div>

        <form data-compra novalidate>
          <h2 class="izq" style="margin-top:32px">Tus datos</h2>
          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" type="text" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" autocomplete="email" inputmode="email" required>
            <small>Aquí te enviamos tu arte digital y la confirmación con tus números.</small>
          </div>
          <div class="casilla">
            <input id="acepto" type="checkbox" required>
            <label for="acepto">Soy mayor de edad y acepto las <a href="reglas.html">reglas oficiales</a> y los <a href="terminos.html">términos y condiciones</a>.</label>
          </div>
        </form>
      </div>
    </section>
  </main>

  <div class="barra-pago">
    <div><small>Total</small><strong data-total>$5.00</strong></div>
    <button class="boton sol" type="button" data-pagar>Pagar</button>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
